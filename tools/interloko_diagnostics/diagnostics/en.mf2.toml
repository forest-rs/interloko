"tape.build-error" = "execution tape builder rejected the emitted program"
"runtime.missing-main" = "no zero-argument main function is available"
"runtime.missing-function" = "requested function is missing"
"runtime.main-has-parameters" = "main has parameters"
"runtime.trap" = "runtime execution trapped"
"runtime.main-returned-non-i64" = "main returned a non-integer result"
