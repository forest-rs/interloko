[messages]
"uncategorized" = "uncategorized diagnostic"
"syntax.expected-expression" = "expected expression"
"syntax.expected-token" = "expected { $expected }"
"syntax.lexer-disagreement" = "internal error: the grammar read `{ $grammar }` but the lexer read `{ $lexer }`"
"ast.integer-literal-out-of-range" = "integer literal is out of range"
"ast.float-literal-out-of-range" = "float literal is too large to be a finite float"
"ast.literal-suffix-mismatch" = "an integer suffix needs an integer literal; write { $suffix } on whole digits, or use f32"
"ast.malformed-string-literal" = "malformed string literal"
"ast.malformed-character-literal" = "malformed character literal: write one character or escape between single quotes"
"ast.slot-option-requires-keyword" = "slot option `{ $option }` requires a keyword value"
"ast.slot-init-value-requires-expression" = "slot option `{ $option }` requires an expression"
"ast.unsupported-slot-option" = "unsupported slot option `{ $option }`"
"ast.invalid-method-specializer" = "method parameters must include explicit specializers"
"ast.annotation-not-class" = "{ $position } `{ $name }` is declared { $type }, but it must name a class"
"ast.invalid-instance-of" = "invalid instance? form"
"ast.invalid-cast" = "invalid as form"
"ast.invalid-type-literal" = "`limited` takes a type and its `min:` and `max:` bounds, as in `limited(<integer>, min: 0, max: 255)`"
"ast.invalid-signal" = "signal expects exactly one condition"
"ast.anonymous-keyword-parameter" = "an anonymous function cannot take `#key` parameters yet; define a function, which can be passed as a value"
"ast.invalid-slot-assignment" = "assignment target must be a local name or `object.slot`"
"ast.duplicate-adjective" = "`{ $adjective }` is written twice"
"ast.conflicting-adjectives" = "`{ $adjective }` contradicts `{ $other }`"
"sem.duplicate-definition" = "{ $kind } `{ $name }` is already defined"
"sem.unresolved-superclass" = "unresolved superclass `{ $superclass }` for class `{ $class }`"
"sem.invalid-primitive-superclass" = "class `{ $class }` cannot inherit from primitive `{ $superclass }`"
"sem.invalid-host-backed-superclass" = "class `{ $class }` cannot inherit from host-backed class `{ $superclass }`"
"sem.class-inheritance-cycle" = "class inheritance cycle involving `{ $class }`"
"sem.duplicate-effective-slot" = "class `{ $class }` has duplicate effective slot `{ $slot }`"
"sem.duplicate-effective-init-keyword" = "class `{ $class }` has duplicate effective init keyword `{ $keyword }`"
"sem.duplicate-slot-init-keyword" = "class `{ $class }` has duplicate init keyword `{ $keyword }`"
"sem.duplicate-effective-accessor" = "class `{ $class }` has duplicate effective accessor `{ $accessor }`"
"sem.host-class-conflict" = "host-backed class `{ $class }` conflicts with a source class"
"sem.unresolved-class" = "unresolved class `{ $class }`"
"sem.unresolved-generic" = "unresolved generic `{ $generic }`"
"sem.unresolved-function-or-generic" = "unresolved function or generic `{ $callee }`"
"sem.unresolved-local" = "unresolved local `{ $local }`"
"sem.unresolved-hyphenated-local" = "unresolved local `{ $local }`; a hyphen is part of a name, so did you mean `{ $spaced }`?"
"sem.duplicate-local" = "duplicate local `{ $local }`"
"sem.ambiguous-callable" = "accessor `{ $accessor }` is ambiguous as a value"
"sem.function-arity-mismatch" = "function `{ $callee }` expects { $expected_count } arguments but got { $actual_count }"
"sem.function-argument-type-mismatch" = "function `{ $function }` argument { $argument_index } expects { $expected } but got { $actual }"
"sem.function-return-type-mismatch" = "function `{ $function }` returns { $expected } but body has { $actual }"
"sem.constant-initializer-type-mismatch" = "constant `{ $constant }` cannot hold { $actual } without a declared type; declare it `:: <callable>` or with a callable(…) signature"
"sem.constant-type-mismatch" = "constant `{ $constant }` expects { $expected } but initializer has { $actual }"
"sem.local-type-mismatch" = "local `{ $local }` expects { $expected } but initializer has { $actual }"
"sem.scalar-result-arity-mismatch" = "this { $context } needs exactly 1 value, not { $actual }; bind several with `let (a, b) = …` first"
"sem.generic-method-specializer-type-mismatch" = "method `{ $method }` argument { $argument_index } specializer { $actual } does not satisfy generic contract { $expected }"
"sem.generic-method-arity-mismatch" = "method `{ $method }` has { $actual_count } parameters but generic expects { $expected_count }"
"sem.ambiguous-generic-method-dispatch" = "generic `{ $generic }` has ambiguous methods for { $actuals }: { $candidates }"
"sem.generic-method-result-type-mismatch" = "method `{ $method }` result { $actual } does not satisfy generic return { $expected }"
"sem.method-return-type-mismatch" = "method `{ $method }` returns { $expected } but body has { $actual }"
"sem.generic-argument-type-mismatch" = "generic `{ $generic }` argument { $argument_index } expects { $expected } but got { $actual }"
"sem.no-applicable-method" = "no method of `{ $generic }` accepts { $actual } as argument { $argument_index }: its methods specialize it on { $specializers }; pass one of those, or define a method on { $class }"
"sem.generic-without-methods" = "`{ $generic }` has no methods, so none accepts { $actual } as argument { $argument_index }; define one on { $class }"
"sem.if-condition-type-mismatch" = "{ $form } test must be a { $expected }, not { $actual }"
"sem.if-branch-type-mismatch" = "{ $form } branches must produce the same types, not { $then } and { $else }"
"sem.arithmetic-operand-type-mismatch" = "arithmetic operands must be numbers, not { $lhs } and { $rhs }"
"sem.comparison-operand-type-mismatch" = "comparison operands must be numbers, not { $lhs } and { $rhs }"
"sem.integer-division-unsupported" = "`/` divides floats; convert integer operands with as(<double-float>, …) or as(<single-float>, …)"
"sem.wrapping-operand-type-mismatch" = "`{ $op }` wraps within one fixed-width type such as <u32>; its operands are { $lhs } and { $rhs }"
"sem.integer-operand-type-mismatch" = "`{ $function }` takes integers, not { $lhs } and { $rhs }"
"sem.shift-count-out-of-range" = "`{ $function }` shifts a 32-bit value by 0 to 31 bits, not { $count }"
"sem.abstract-numeric-type-unsupported" = "{ $class } is abstract and cannot type a value yet; use a concrete class such as <integer> or <double-float>, or <object>"
"sem.limited-type-specializer" = "{ $type } is a limited <integer> type, not a class; a method may specialize on it only where its generic declares the parameter { $type }"
"sem.limited-type-base" = "`limited` limits <integer>, not { $base }"
"sem.limited-type-option" = "`{ $option }:` is not an option here; `limited` takes one `min:` and one `max:`"
"sem.limited-type-bound" = "the `{ $option }:` bound of `limited` must be an <integer> literal, not `{ $bound }`"
"sem.empty-limited-type" = "{ $type } has no values: its `min:` is above its `max:`"
"sem.limited-parameter-specializer" = "the generic declares this parameter { $type }; a method must specialize it as { $type } too, so its body computes with the same type"
"sem.apply-arity-mismatch" = "apply expects a callable and arguments"
"sem.apply-target-type-mismatch" = "apply calls a function, generic or <callable> value, not { $actual }"
"sem.unchecked-callable-result" = "a call through a <callable> value cannot be checked to return { $expected }; call the function by name instead"
"sem.untyped-callable-result" = "the result of a call through a <callable> value needs a declared type here: write `let r :: <integer> = apply(…)`, or declare the callable's signature, such as callable(<integer>) => <integer>"
"sem.callable-parameter-variance" = "{ $actual } cannot be called as { $expected }: its parameter { $index } accepts only { $accepted }, but callers may pass any { $passed }"
"sem.callable-result-variance" = "{ $actual } cannot be called as { $expected }: its result { $index } may be any { $returned }, but callers rely on { $relied }"
"sem.signal-condition-type-mismatch" = "signal needs an instance of a known class, such as a <condition> subclass, not { $actual }; convert an <object> with as(…) first"
"sem.handle-restart-result-mismatch" = "handle body and restart must produce the same types, not { $body } and { $restart }"
"sem.block-exit-result-mismatch" = "block body and exit must produce the same types, not { $body } and { $exit }"
"sem.restart-guard-type-mismatch" = "restart guard must produce <boolean>, not { $actual }"
"sem.class-of-type-mismatch" = "class-of needs an instance of a known class, not { $actual }; convert an <object> with as(…) first"
"sem.instance-of-impossible" = "instance? test is impossible: { $actual } is not { $expected }"
"sem.cast-impossible" = "cast is impossible: { $actual } is not { $expected }"
"sem.select-test-type-mismatch" = "a select `by` test must be a function of the target and a key that returns a <boolean>, not { $actual }"
"sem.make-class-argument-type-mismatch" = "make needs a class, such as <circle>, not { $actual }"
"sem.host-backed-make" = "host-backed class `{ $class }` cannot be constructed with make"
"sem.builtin-value-make" = "built-in value class `{ $class }` cannot be constructed with make"
"sem.abstract-class-make" = "abstract class `{ $class }` has no direct instances, so make cannot construct it"
"sem.duplicate-init-keyword" = "duplicate initializer for keyword `{ $keyword }`"
"sem.unknown-init-keyword" = "class `{ $class }` has no init keyword `{ $keyword }`"
"sem.slot-initializer-type-mismatch" = "slot `{ $slot }` expects { $expected } but initializer has { $actual }"
"sem.slot-assignment-type-mismatch" = "slot `{ $slot }` expects { $expected } but assigned value has { $actual }"
"sem.slot-assignment-read-only" = "slot `{ $slot }` on `{ $class }` is read-only ({ $reason })"
"sem.local-assignment-type-mismatch" = "local `{ $local }` holds { $expected } but is assigned { $actual }; a `let` without a type takes its initializer's"
"sem.assignment-target-not-assignable" = "`{ $name }` is a { $kind } and cannot be assigned; only `let` locals can"
"sem.unexpected-keyword-argument" = "`{ $callee }` takes no `{ $keyword }:` argument"
"sem.duplicate-keyword-argument" = "`{ $keyword }:` is given more than once"
"sem.keyword-argument-type-mismatch" = "`{ $callee }` keyword `{ $keyword }:` expects { $expected } but got { $actual }"
"sem.reserved-name" = "`{ $name }` is reserved: it is the kernel constant a keyword declared without a default takes when a call does not pass it"
"sem.keyword-parameter-needs-default" = "`#key { $keyword }` of type { $type } needs a default: only an `<object>` keyword can go without one, taking `$unsupplied` when a call does not pass it"
"sem.method-keyword-not-in-generic" = "`#key { $keyword }` is not a keyword of `{ $generic }`: a method takes only keywords its generic declares"
"sem.method-keyword-default" = "`#key { $keyword }` of a method of `{ $generic }` cannot have a default: a send takes defaults from the generic, which declares them"
"sem.method-keyword-type-mismatch" = "`#key { $keyword }` of `{ $generic }` is { $expected }, not { $actual }: a method keeps its generic's keyword types"
"sem.collection-method-overrides-kernel" = "`{ $function }` already has the kernel's method for { $class }; a method for it or a subclass would override it"
"sem.for-clause-type-mismatch" = "`for` clause `{ $word }` expects { $expected } but has { $actual }; a numeric `for` counts in <integer>s"
"sem.slot-default-type-mismatch" = "slot `{ $slot }` expects { $expected } but default init-value has { $actual }"
"sem.slot-default-binds-locals" = "slot `{ $slot }`'s init-value binds the local `{ $local }`; slot defaults cannot bind locals yet, so define a function and call it"
"sem.constant-initializer-cycle" = "constant `{ $constant }` reads itself while it is initialized: { $cycle }"
"sem.missing-required-init-keyword" = "missing required init keyword `{ $keyword }` for slot `{ $slot }`"
"sem.missing-slot-initializer" = "missing initializer for slot `{ $slot }`"
"sem.unknown-slot" = "class `{ $class }` has no slot `{ $slot }`"
"sem.slot-receiver-type-mismatch" = "slot `{ $accessor }` needs an instance of a known class, not { $actual }; convert an <object> with as(…) first"
"typing.dispatch-no-applicable-method" = "no method of `{ $generic }` can apply to { $arguments }; this call always fails when reached"
"typing.dispatch-runtime-checked" = "call to `{ $generic }` with { $arguments } depends on runtime classes to find a method"
"typing.cast-always-fails" = "cast of { $actual } to { $expected } always fails when reached"
"typing.cast-runtime-checked" = "cast of { $actual } to { $expected } is checked at runtime"
"typing.dispatch-proved" = "call to `{ $generic }` with { $arguments } always finds a method"
"typing.cast-always-succeeds" = "cast of { $actual } to { $expected } always succeeds"
"typing.instance-always-true" = "`instance?` test of { $actual } against { $expected } is always true"
"typing.instance-runtime-checked" = "`instance?` test of { $actual } against { $expected } is decided at runtime"
"typing.instance-always-false" = "`instance?` test of { $actual } against { $expected } is always false"
"typing.range-always-within" = "{ $actual } is always within { $expected }"
"typing.range-runtime-checked" = "whether { $actual } is within { $expected } is checked at runtime"
"typing.range-always-outside" = "{ $actual } is never within { $expected }"
"typing.overflow-impossible" = "`{ $operation }` on { $actual } never traps (limit { $expected })"
"typing.overflow-runtime-checked" = "`{ $operation }` on { $actual } may trap (limit { $expected })"
"typing.overflow-certain" = "`{ $operation }` on { $actual } always traps when reached (limit { $expected })"
"typing.unproved-dispatch" = "{ $definition } is strict ({ $strict }), but typing cannot prove that `{ $generic }` finds a method for { $arguments } ({ $decision })"
"typing.unproved-cast" = "{ $definition } is strict ({ $strict }), but typing cannot prove that { $actual } is { $expected } ({ $decision })"
"typing.unproved-range" = "{ $definition } is strict ({ $strict }), but typing cannot prove that { $actual } is within { $expected } ({ $decision })"
"typing.unproved-overflow" = "{ $definition } is strict ({ $strict }), but typing cannot prove that `{ $operation }` on { $actual } stays within { $expected } ({ $decision })"
"lower.invalid-semantic" = "internal compiler error: lowering rejected a checked program: { $detail }"
"lower.blocked-by-diagnostics" = "lowering stopped because earlier diagnostics exist"
"tape.invalid-lowered" = "internal compiler error: tape emission rejected lowered IR: { $detail }"
"tape.blocked-by-diagnostics" = "tape emission stopped because earlier diagnostics exist"
"tape.build-error" = "internal compiler error: execution tape builder rejected the emitted program: { $detail }"
"runtime.missing-main" = "no zero-argument main function is available"
"runtime.main-has-parameters" = "main has parameters"
"runtime.trap" = "runtime execution trapped"
"runtime.host-function-failed" = "a declared host function failed"
"runtime.unsupported-result" = "main does not return one supported scalar value"
"runtime.unhandled-condition" = "no live handler applies to a signalled condition"
"runtime.expired-exit" = "a block exit was called after its block returned"
"runtime.aborted" = "a condition chooser aborted the run"
"runtime.failed" = "the runtime ended the run for an unclassified reason"
"type-error.cast" = "a value is not an instance of the class a cast expects"
"type-error.entry" = "a value passed to a callable is not of its parameter's class"
"type-error.range" = "a number is outside the range of the type it must convert to"
"type-error.overflow" = "integer arithmetic produced a result its type cannot represent"
"dispatch.no-applicable-method" = "a generic send found no method for its arguments"
"constant.read-during-initialization" = "a constant was read while its own initializer was running"
"session.unknown-source" = "session source file id is unknown"
