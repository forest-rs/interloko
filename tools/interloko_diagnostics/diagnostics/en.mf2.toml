[messages]
"uncategorized" = "uncategorized diagnostic"
"syntax.expected-expression" = "expected expression"
"syntax.expected-token" = "expected { $expected }"
"ast.integer-literal-out-of-range" = "integer literal is out of range"
"ast.float-literal-out-of-range" = "float literal is too large to be a finite float"
"ast.literal-suffix-mismatch" = "an integer suffix needs an integer literal; write { $suffix } on whole digits, or use f32"
"ast.malformed-string-literal" = "malformed string literal"
"ast.slot-option-requires-keyword" = "slot option `{ $option }` requires a keyword value"
"ast.slot-init-value-requires-expression" = "slot option `{ $option }` requires an expression"
"ast.unsupported-slot-option" = "unsupported slot option `{ $option }`"
"ast.invalid-method-specializer" = "method parameters must include explicit specializers"
"ast.invalid-instance-of" = "invalid instance? form"
"ast.invalid-cast" = "invalid as form"
"ast.invalid-signal" = "signal expects exactly one condition"
"ast.invalid-slot-assignment" = "slot assignment target must be `object.slot`"
"sem.duplicate-definition" = "{ $kind } `{ $name }` is already defined"
"sem.unresolved-superclass" = "unresolved superclass `{ $superclass }` for class `{ $class }`"
"sem.invalid-primitive-superclass" = "class `{ $class }` cannot inherit from primitive `{ $superclass }`"
"sem.invalid-host-backed-superclass" = "class `{ $class }` cannot inherit from host-backed class `{ $superclass }`"
"sem.class-inheritance-cycle" = "class inheritance cycle involving `{ $class }`"
"sem.duplicate-effective-slot" = "class `{ $class }` has duplicate effective slot `{ $slot }`"
"sem.duplicate-effective-init-keyword" = "class `{ $class }` has duplicate effective init keyword `{ $keyword }`"
"sem.duplicate-slot-init-keyword" = "class `{ $class }` has duplicate init keyword `{ $keyword }`"
"sem.duplicate-effective-accessor" = "class `{ $class }` has duplicate effective accessor `{ $accessor }`"
"sem.host-class-conflict" = "host-backed class `{ $class }` conflicts with a source class"
"sem.unresolved-class" = "unresolved class `{ $class }`"
"sem.unresolved-generic" = "unresolved generic `{ $generic }`"
"sem.unresolved-function-or-generic" = "unresolved function or generic `{ $callee }`"
"sem.unresolved-local" = "unresolved local `{ $local }`"
"sem.duplicate-local" = "duplicate local `{ $local }`"
"sem.ambiguous-callable" = "accessor `{ $accessor }` is ambiguous as a value"
"sem.function-arity-mismatch" = "function `{ $callee }` expects { $expected_count } arguments but got { $actual_count }"
"sem.function-argument-type-mismatch" = "function `{ $function }` argument { $argument_index } expects { $expected } but got { $actual }"
"sem.function-return-type-mismatch" = "function `{ $function }` returns { $expected } but body has { $actual }"
"sem.constant-initializer-type-mismatch" = "constant `{ $constant }` initializer must produce a runtime value; got { $actual }"
"sem.constant-type-mismatch" = "constant `{ $constant }` expects { $expected } but initializer has { $actual }"
"sem.local-type-mismatch" = "local `{ $local }` expects { $expected } but initializer has { $actual }"
"sem.scalar-result-arity-mismatch" = "scalar { $context } expects 1 value but got { $actual }"
"sem.generic-method-specializer-type-mismatch" = "method `{ $method }` argument { $argument_index } specializer { $actual } does not satisfy generic contract { $expected }"
"sem.generic-method-arity-mismatch" = "method `{ $method }` has { $actual_count } parameters but generic expects { $expected_count }"
"sem.ambiguous-generic-method-dispatch" = "generic `{ $generic }` has ambiguous methods for { $actuals }: { $candidates }"
"sem.generic-method-result-type-mismatch" = "method `{ $method }` result { $actual } does not satisfy generic return { $expected }"
"sem.method-return-type-mismatch" = "method `{ $method }` returns { $expected } but body has { $actual }"
"sem.generic-argument-type-mismatch" = "generic `{ $generic }` argument { $argument_index } expects { $expected } but got { $actual }"
"sem.if-condition-type-mismatch" = "if condition must be bool; got { $actual }"
"sem.if-branch-type-mismatch" = "if branches must have matching result kinds"
"sem.arithmetic-operand-type-mismatch" = "arithmetic operands must be numbers, not { $lhs } and { $rhs }"
"sem.comparison-operand-type-mismatch" = "comparison operands must be numbers, not { $lhs } and { $rhs }"
"sem.integer-division-unsupported" = "`/` divides floats; convert integer operands with as(<double-float>, …) or as(<single-float>, …)"
"sem.wrapping-operand-type-mismatch" = "`{ $op }` wraps within one fixed-width type such as <u32>; its operands are { $lhs } and { $rhs }"
"sem.integer-operand-type-mismatch" = "`{ $function }` takes integers, not { $lhs } and { $rhs }"
"sem.shift-count-out-of-range" = "`{ $function }` shifts a 32-bit value by 0 to 31 bits, not { $count }"
"sem.abstract-numeric-type-unsupported" = "{ $class } is abstract and cannot type a value yet; use a concrete class such as <integer> or <double-float>, or <object>"
"sem.limited-type-specializer" = "{ $type } is a limited <integer> type, not a class; a method may specialize on it only where its generic declares the parameter { $type }"
"sem.apply-arity-mismatch" = "apply expects a callable and arguments"
"sem.apply-target-type-mismatch" = "apply target must be a { $expected }, got { $actual }"
"sem.signal-condition-type-mismatch" = "signal condition must be a known object"
"sem.handle-restart-result-mismatch" = "handle body and restart must have matching result kinds: body { $body }, restart { $restart }"
"sem.block-exit-result-mismatch" = "block body and exit must have matching result kinds: body { $body }, exit { $exit }"
"sem.restart-guard-type-mismatch" = "restart guard must produce <boolean>, not { $actual }"
"sem.class-of-type-mismatch" = "class-of requires a known object"
"sem.instance-of-type-mismatch" = "instance? expects { $expected } or a known object, got { $actual }"
"sem.instance-of-impossible" = "instance? test is impossible: { $actual } is not { $expected }"
"sem.cast-type-mismatch" = "as expects { $expected } or a known object, got { $actual }"
"sem.cast-impossible" = "cast is impossible: { $actual } is not { $expected }"
"sem.make-class-argument-type-mismatch" = "make class argument must be a known class object"
"sem.host-backed-make" = "host-backed class `{ $class }` cannot be constructed with make"
"sem.builtin-value-make" = "built-in value class `{ $class }` cannot be constructed with make"
"sem.duplicate-init-keyword" = "duplicate initializer for keyword `{ $keyword }`"
"sem.unknown-init-keyword" = "class `{ $class }` has no init keyword `{ $keyword }`"
"sem.slot-initializer-type-mismatch" = "slot `{ $slot }` expects { $expected } but initializer has { $actual }"
"sem.slot-assignment-type-mismatch" = "slot `{ $slot }` expects { $expected } but assigned value has { $actual }"
"sem.slot-assignment-read-only" = "slot `{ $slot }` on `{ $class }` is read-only ({ $reason })"
"sem.slot-default-type-mismatch" = "slot `{ $slot }` expects { $expected } but default init-value has { $actual }"
"sem.missing-required-init-keyword" = "missing required init keyword `{ $keyword }` for slot `{ $slot }`"
"sem.missing-slot-initializer" = "missing initializer for slot `{ $slot }`"
"sem.unknown-slot" = "class `{ $class }` has no slot `{ $slot }`"
"sem.slot-receiver-type-mismatch" = "slot receiver must be a known object, got { $actual }"
"typing.dispatch-no-applicable-method" = "no method of `{ $generic }` can apply to { $arguments }; this call always fails when reached"
"typing.dispatch-runtime-checked" = "call to `{ $generic }` with { $arguments } depends on runtime classes to find a method"
"typing.cast-always-fails" = "cast of { $actual } to { $expected } always fails when reached"
"typing.cast-runtime-checked" = "cast of { $actual } to { $expected } is checked at runtime"
"lower.invalid-semantic" = "lowering failed because semantic IR was invalid"
"lower.blocked-by-diagnostics" = "lowering stopped because earlier diagnostics exist"
"tape.invalid-lowered" = "tape emission failed because lowered IR was invalid"
"tape.blocked-by-diagnostics" = "tape emission stopped because earlier diagnostics exist"
"tape.build-error" = "execution tape builder rejected the emitted program"
"runtime.missing-main" = "no zero-argument main function is available"
"runtime.main-has-parameters" = "main has parameters"
"runtime.trap" = "runtime execution trapped"
"runtime.integer-overflow" = "integer arithmetic overflowed the 64-bit integer range"
"runtime.host-function-failed" = "a declared host function failed"
"runtime.unsupported-result" = "main does not return one supported scalar value"
"runtime.unhandled-condition" = "no live handler applies to a signalled condition"
"runtime.expired-exit" = "a block exit was called after its block returned"
"runtime.aborted" = "a condition chooser aborted the run"
"session.unknown-source" = "session source file id is unknown"
