[workspace]
members = [
    "crates/cairn_compiler",
    "crates/interloko_model",
    "examples/forty_two",
    "examples/generic_area",
    "examples/host_backed_area",
    "examples/rich_values",
    "tools/cairn_corpus",
    "tools/cairn_diagnostics",
    "tools/cairn_lab",
    "tools/cairn_repl",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
version = "0.1.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
