[workspace]
members = [
    "crates/interloko_compiler",
    "crates/interloko_grammar",
    "crates/interloko_model",
    "crates/interloko_runtime",
    "examples/forty_two",
    "examples/generic_area",
    "examples/host_backed_area",
    "examples/rich_values",
    "tools/interloko_corpus",
    "tools/interloko_diagnostics",
    "tools/interloko_lab",
    "tools/interloko_repl",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
version = "0.1.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
